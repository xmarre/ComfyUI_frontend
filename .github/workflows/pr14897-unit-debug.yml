name: PR 14897 focused unit debug

on:
  push:
    branches:
      - mirror/pr-14897-20260826-unit-debug

permissions:
  contents: write

jobs:
  patch-test-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: mirror/pr-14897-20260825-compose-tests
          fetch-depth: 0
      - name: Reconcile workflow draft store mock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/platform/workflow/core/services/workflowService.test.ts')
          text = path.read_text()
          old = """const draftStoreMocks = vi.hoisted(() => ({
            saveDraft: vi.fn(() => true),
            getDraft: vi.fn(),
            removeDraft: vi.fn(),
            markDraftUsed: vi.fn()
          }))
          """
          new = """const draftStoreMocks = vi.hoisted(() => ({
            saveDraft: vi.fn(() => true),
            getDraft: vi.fn(),
            removeDraft: vi.fn(),
            markDraftUsed: vi.fn(),
            isPersistencePaused: vi.fn(() => false),
            shouldNotifySaveFailure: vi.fn(() => true),
            markSaveSucceeded: vi.fn()
          }))
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one mock block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- src/platform/workflow/core/services/workflowService.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/platform/workflow/core/services/workflowService.test.ts
          git commit -m 'test: reconcile workflow draft store mock'
          git push origin HEAD:mirror/pr-14897-20260825-compose-tests
