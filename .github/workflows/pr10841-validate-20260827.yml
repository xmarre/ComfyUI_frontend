name: PR 10841 format mirror 20260827
on:
  push:
    branches:
      - mirror/pr-10841-validate-20260827
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Format mirror candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --no-tags --branch mirror/pr-10841-upstream-20260827 "https://x-access-token:${GH_TOKEN}@github.com/xmarre/ComfyUI_frontend.git" repo
          cd repo
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec oxfmt --write \
            src/renderer/extensions/vueNodes/composables/useVueNodeDragAndDrop.test.ts \
            src/scripts/app.test.ts
          git diff --check
          git add \
            src/renderer/extensions/vueNodes/composables/useVueNodeDragAndDrop.test.ts \
            src/scripts/app.test.ts
          git commit -m "style: format drag-drop review tests"
          echo "FORMATTED_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:mirror/pr-10841-upstream-20260827
