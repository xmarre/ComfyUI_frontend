name: Harden workflow draft quota recovery v2

on:
  push:
    branches:
      - codex/harden-workflow-draft-quota-recovery
    paths:
      - .github/workflows/harden-workflow-draft-quota-recovery-v2.yml

permissions:
  contents: write

concurrency:
  group: harden-workflow-draft-quota-recovery-v2
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/harden-workflow-draft-quota-recovery

      - name: Apply hardening patch
        run: |
          python scripts/fix-harden-workflow-draft-patch-script.py
          python scripts/harden-workflow-draft-quota-recovery.py

      - name: Install frontend dependencies
        uses: ./.github/actions/setup-frontend

      - name: Format
        run: pnpm format

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:no-cache

      - name: Run persistence regression tests
        run: |
          pnpm test:unit \
            src/platform/workflow/persistence/base/storageIO.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.quotaSafety.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.fsm.test.ts \
            src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.test.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        env:
          NX_SKIP_NX_CACHE: 'true'
          VITE_USE_LEGACY_DEFAULT_GRAPH: 'true'
        run: pnpm run build

      - name: Publish clean single-commit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git rm -f \
            .github/workflows/harden-workflow-draft-quota-recovery.yml \
            .github/workflows/harden-workflow-draft-quota-recovery-v2.yml \
            scripts/harden-workflow-draft-quota-recovery.py \
            scripts/fix-harden-workflow-draft-patch-script.py
          git add -A
          git diff --cached --check
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'fix: preserve workflow drafts across quota failures' | git commit-tree "$tree" -p 1485bb3ec538470143bd6fdb5c27bd4d246204f7)"
          git reset --hard "$commit"
          git push --force origin HEAD:fix/workflow-draft-quota-recovery
