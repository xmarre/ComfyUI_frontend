name: PR 14897 temporary mirror patch

on:
  push:
    branches:
      - mirror/pr-14897-20260825-compose-tests

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: mirror/pr-14897-20260825-compose-tests
          fetch-depth: 0
      - name: Apply exact test reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/platform/workflow/core/services/workflowService.test.ts')
          text = path.read_text()
          old = """          name: activeWorkflow.key,\n          isTemporary: activeWorkflow.isTemporary\n"""
          new = """          name: activeWorkflow.key,\n          isTemporary: activeWorkflow.isTemporary,\n          isModified: activeWorkflow.isModified\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale persistence expectation, found {count}')
          path.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/pr14897-temp-test-patch.yml')
          workflow.unlink()
          PY
      - name: Commit mirror-only reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/platform/workflow/core/services/workflowService.test.ts .github/workflows/pr14897-temp-test-patch.yml
          git diff --cached --check
          git commit -m 'test: reconcile workflow service persistence expectation'
          git push origin HEAD:mirror/pr-14897-20260825-compose-tests
