name: PR 14897 apply final review fixes

on:
  push:
    branches:
      - mirror/pr-14897-20260826-final-review-fixes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: mirror/pr-14897-20260826-final-review-fixes
          fetch-depth: 0
      - name: Apply verified CodeRabbit fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'browser_tests/tests/workflowPersistenceRecovery.spec.ts': [(
                  """    await expect(comfyPage.toast.toastErrors).toHaveCount(1)\n    await comfyPage.page.evaluate(\n      () => new Promise<void>((resolve) => setTimeout(resolve, 700))\n    )\n    await expect(comfyPage.toast.toastErrors).toHaveCount(1)\n""",
                  """    // pagehide synchronously flushes pending workflow persistence, so this\n    // retrying assertion observes the final notification count without a hard wait.\n    await expect(comfyPage.toast.toastErrors).toHaveCount(1)\n"""
              )],
              'src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.reconciliation.test.ts': [(
                  """  afterEach(() => {\n    for (const { app, container } of mountedApps.splice(0)) {\n      app.unmount()\n      container.remove()\n    }\n  })\n""",
                  """  afterEach(() => {\n    for (const { app, container } of mountedApps.splice(0)) {\n      app.unmount()\n      container.remove()\n    }\n    vi.useRealTimers()\n  })\n"""
              )],
              'src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.ts': [(
                  """  if (migrationResult >= 0) draftStore.reset()\n""",
                  """  const migrationMutatedV2Storage = migrationResult >= 0\n  if (migrationMutatedV2Storage) draftStore.reset()\n"""
              )],
              'src/platform/workflow/persistence/stores/workflowDraftStoreV2.rollbackSafety.test.ts': [
                  ("""    expect(payloadWrites).toBe(1)\n    expect(indexWrites).toBe(2)\n""", """    expect(payloadWrites).toBeGreaterThan(0)\n    expect(indexWrites).toBeGreaterThan(1)\n"""),
                  ("""    expect(targetWrites).toBe(4)\n""", """    expect(targetWrites).toBeGreaterThan(3)\n"""),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  expected = 2 if filename.endswith('workflowDraftStoreV2.rollbackSafety.test.ts') and old == "    expect(targetWrites).toBe(4)\n" else 1
                  if count != expected:
                      raise SystemExit(f'{filename}: expected {expected} occurrence(s), found {count}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          rm .github/workflows/pr14897-final-review-fixes.yml
          git diff --check
          git diff -- browser_tests/tests/workflowPersistenceRecovery.spec.ts \
            src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.reconciliation.test.ts \
            src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.rollbackSafety.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: address final persistence review findings'
          git push origin HEAD:mirror/pr-14897-20260826-final-review-fixes
