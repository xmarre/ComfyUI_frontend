name: PR 14897 candidate reconciliation

on:
  push:
    branches:
      - mirror/pr-14897-20260905-work

permissions:
  contents: write

jobs:
  reconcile-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build one-commit candidate from current upstream base
        shell: bash
        run: |
          set -euo pipefail
          BASE=ca54f4bd2eb03b9fc992feee3aff3b9700f73395
          OLD_HEAD=82e5fa6b9d5e258d5722a33e0d4ac4198d782a09
          git config user.name 'xmarre'
          git config user.email '54859656+xmarre@users.noreply.github.com'
          git config merge.conflictStyle diff3
          git reset --hard "$BASE"
          git fetch origin fix/workflow-draft-quota-recovery

          set +e
          git cherry-pick "$OLD_HEAD"
          status=$?
          set -e
          test "$status" -ne 0

          python3 <<'PY'
          from pathlib import Path

          def split_conflict(path: str):
              p = Path(path)
              lines = p.read_text().splitlines(keepends=True)
              starts = [i for i, line in enumerate(lines) if line.startswith('<<<<<<< ')]
              if len(starts) != 1:
                  raise RuntimeError(f'{path}: expected exactly one conflict, got {len(starts)}')
              start = starts[0]
              base_sep = next(i for i in range(start + 1, len(lines)) if lines[i].startswith('||||||| '))
              theirs_sep = next(i for i in range(base_sep + 1, len(lines)) if lines[i].startswith('======='))
              end = next(i for i in range(theirs_sep + 1, len(lines)) if lines[i].startswith('>>>>>>> '))
              return p, lines, start, base_sep, theirs_sep, end

          def replace_conflict(path: str, replacement: str):
              p, lines, start, _base_sep, _theirs_sep, end = split_conflict(path)
              lines[start:end + 1] = replacement.splitlines(keepends=True)
              p.write_text(''.join(lines))

          def replace_once(text: str, old: str, new: str, path: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one occurrence of {old!r}, got {count}')
              return text.replace(old, new, 1)

          def replace_exact_count(text: str, old: str, new: str, count: int, path: str) -> str:
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f'{path}: expected {count} occurrences of {old!r}, got {actual}')
              return text.replace(old, new)

          storage = 'src/platform/workflow/persistence/base/storageIO.ts'
          replace_conflict(
              storage,
              """      targetWorkspaceId,\n      isValidOpenPathsPointer\n    ) ??\n    (targetWorkspaceId ? readPersistentOpenPaths(targetWorkspaceId) : null)\n""",
          )
          p = Path(storage)
          text = p.read_text()
          text = replace_once(
              text,
              'function isValidIndex(value: unknown): value is DraftIndexV2 {',
              """type PersistedDraftIndexV2 = Omit<DraftIndexV2, 'order' | 'entries'> & {\n  order: unknown[]\n  entries: Record<string, unknown>\n}\n\nfunction isValidIndex(value: unknown): value is PersistedDraftIndexV2 {""",
              storage,
          )
          text = replace_once(
              text,
              'function sanitizeIndexEntries(index: DraftIndexV2): DraftIndexV2 {',
              'function sanitizeIndexEntries(index: PersistedDraftIndexV2): DraftIndexV2 {',
              storage,
          )
          text = replace_once(
              text,
              '  const order = index.order.filter((draftKey) => {',
              '  const order = index.order.filter((draftKey): draftKey is string => {',
              storage,
          )
          p.write_text(text)

          migration = 'src/platform/workflow/persistence/migration/migrateV1toV2.ts'
          replace_conflict(
              migration,
              """  const legacy = mergedV1Data(sources)\n  const baseIndex = originalIndex ?? createEmptyIndex()\n  const legacyByKey = new Map<\n    string,\n    { path: string; draft: V1DraftSnapshot }\n  >()\n  let hasHashCollision = false\n\n  const draftsByPath: Partial<Record<string, V1DraftSnapshot>> = legacy.drafts\n  for (const path of legacy.order) {\n    const draft = draftsByPath[path]\n    if (!draft) continue\n\n    const draftKey = hashPath(path)\n    const previous = legacyByKey.get(draftKey)\n    if (previous && previous.path !== path) {\n      hasHashCollision = true\n      console.warn(\n        `[V2 Migration] Draft-key collision between ${previous.path} and ${path}`\n      )\n      continue\n    }\n    legacyByKey.set(draftKey, { path, draft })\n  }\n""",
          )
          p = Path(migration)
          text = p.read_text()
          text = replace_once(
              text,
              'function mergedV1Data(sources: V1StorageSource[]): {',
              """function getV1Draft(\n  drafts: Record<string, V1DraftSnapshot>,\n  path: string\n): V1DraftSnapshot | undefined {\n  return drafts[path]\n}\n\nfunction getIndexEntry(\n  index: DraftIndexV2,\n  key: string\n): DraftIndexV2['entries'][string] | undefined {\n  return index.entries[key]\n}\n\nfunction mergedV1Data(sources: V1StorageSource[]): {""",
              migration,
          )
          text = replace_once(
              text,
              '      if (!source.drafts[path] || inOrder.has(path)) continue',
              """      const draft = getV1Draft(source.drafts, path)\n      if (!draft || inOrder.has(path)) continue""",
              migration,
          )
          text = replace_once(
              text,
              """      const candidate = source.drafts[path]\n      const previous = drafts[path]\n      if (!previous || candidate.updatedAt >= previous.updatedAt) {\n        drafts[path] = candidate\n      }""",
              """      const candidate = getV1Draft(source.drafts, path)\n      if (!candidate) continue\n      const previous = getV1Draft(drafts, path)\n      if (!previous || candidate.updatedAt >= previous.updatedAt) {\n        drafts[path] = candidate\n      }""",
              migration,
          )
          text = replace_once(
              text,
              '    if (!index.entries[key] || seen.has(key)) continue',
              '    if (!getIndexEntry(index, key) || seen.has(key)) continue',
              migration,
          )
          p.write_text(text)

          store = 'src/platform/workflow/persistence/stores/workflowDraftStoreV2.ts'
          p, lines, start, _base_sep, theirs_sep, end = split_conflict(store)
          lines[start:end + 1] = lines[theirs_sep + 1:end]
          text = ''.join(lines)
          text = replace_once(
              text,
              '        const oldestEntry = currentIndex.entries[oldestKey]\n        const result = oldestEntry\n',
              '        const oldestEntry = getIndexEntry(currentIndex, oldestKey)\n        const result = oldestEntry\n',
              store,
          )
          text = replace_once(
              text,
              '    const existingEntry = index.entries[draftKey]',
              '    const existingEntry = getIndexEntry(index, draftKey)',
              store,
          )
          p.write_text(text)

          composable = 'src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.ts'
          p = Path(composable)
          text = p.read_text()
          text = replace_once(text, '      comfyApp.canvas?.ds,', '      comfyApp.canvas.ds,', composable)
          text = replace_once(
              text,
              '    const savedViewState = activeWorkflow.initialState?.extra?.ds',
              '    const savedViewState = activeWorkflow.initialState.extra?.ds',
              composable,
          )
          p.write_text(text)

          view_test = 'src/platform/workflow/persistence/base/workflowViewState.test.ts'
          p = Path(view_test)
          text = p.read_text()
          text = replace_once(
              text,
              "import type { ComfyWorkflowJSON } from '@/platform/workflow/validation/schemas/workflowSchema'\n",
              '',
              view_test,
          )
          text = replace_exact_count(
              text,
              'structuredClone(defaultGraph) as ComfyWorkflowJSON',
              'structuredClone(defaultGraph)',
              2,
              view_test,
          )
          p.write_text(text)

          reconciliation_test = 'src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.reconciliation.test.ts'
          p = Path(reconciliation_test)
          text = p.read_text()
          text = replace_once(
              text,
              """const teamWorkspaceStoreMocks = reactive({\n  initState: 'uninitialized' as 'uninitialized' | 'ready' | 'error',\n  activeWorkspaceId: null as string | null\n})""",
              """const teamWorkspaceStoreMocks = reactive<{\n  initState: 'uninitialized' | 'ready' | 'error'\n  activeWorkspaceId: string | null\n}>({\n  initState: 'uninitialized',\n  activeWorkspaceId: null\n})""",
              reconciliation_test,
          )
          p.write_text(text)

          quota_test = 'src/platform/workflow/persistence/stores/workflowDraftStoreV2.quotaSafety.test.ts'
          p = Path(quota_test)
          text = p.read_text()
          text = replace_exact_count(
              text,
              'entries?: Record<string, unknown>',
              'entries: Partial<Record<string, unknown>>',
              2,
              quota_test,
          )
          text = replace_exact_count(text, 'index.entries?.[', 'index.entries[', 4, quota_test)
          p.write_text(text)

          rollback_test = 'src/platform/workflow/persistence/stores/workflowDraftStoreV2.rollbackSafety.test.ts'
          p = Path(rollback_test)
          text = p.read_text()
          text = replace_exact_count(
              text,
              'entries?: Record<string, { name?: string }>',
              'entries?: Partial<Record<string, { name?: string }>>',
              4,
              rollback_test,
          )
          text = replace_exact_count(
              text,
              'index.entries?.[evictedDraftKey]',
              'index.entries[evictedDraftKey]',
              4,
              rollback_test,
          )
          p.write_text(text)
          PY

          ! grep -R -n -E '^(<<<<<<<|\|\|\|\|\|\|\||=======|>>>>>>>)' \
            src/platform/workflow/persistence/base/storageIO.ts \
            src/platform/workflow/persistence/migration/migrateV1toV2.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.ts
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check --cached
          GIT_EDITOR=true git cherry-pick --continue

          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = 1

          cat > /tmp/expected-files <<'EOF'
          browser_tests/tests/workflowPersistenceRecovery.spec.ts
          src/platform/workflow/core/services/workflowService.persistence.test.ts
          src/platform/workflow/core/services/workflowService.test.ts
          src/platform/workflow/core/services/workflowService.ts
          src/platform/workflow/management/stores/comfyWorkflow.ts
          src/platform/workflow/management/stores/workflowStore.persistence.test.ts
          src/platform/workflow/persistence/base/draftTypes.ts
          src/platform/workflow/persistence/base/storageIO.test.ts
          src/platform/workflow/persistence/base/storageIO.ts
          src/platform/workflow/persistence/base/workflowViewState.test.ts
          src/platform/workflow/persistence/base/workflowViewState.ts
          src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.reconciliation.test.ts
          src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.ts
          src/platform/workflow/persistence/migration/migrateV1toV2.collision.test.ts
          src/platform/workflow/persistence/migration/migrateV1toV2.malformedPayload.test.ts
          src/platform/workflow/persistence/migration/migrateV1toV2.recovery.test.ts
          src/platform/workflow/persistence/migration/migrateV1toV2.test.ts
          src/platform/workflow/persistence/migration/migrateV1toV2.ts
          src/platform/workflow/persistence/stores/workflowDraftStoreV2.persistenceControl.test.ts
          src/platform/workflow/persistence/stores/workflowDraftStoreV2.quotaSafety.test.ts
          src/platform/workflow/persistence/stores/workflowDraftStoreV2.rollbackSafety.test.ts
          src/platform/workflow/persistence/stores/workflowDraftStoreV2.test.ts
          src/platform/workflow/persistence/stores/workflowDraftStoreV2.ts
          EOF
          sed -i 's/^          //' /tmp/expected-files
          sort -o /tmp/expected-files /tmp/expected-files
          git diff --name-only "$BASE"..HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git show --stat --oneline --summary HEAD

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Format reconciled files and fold formatter delta into the single commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=ca54f4bd2eb03b9fc992feee3aff3b9700f73395
          mapfile -t files < <(git diff --name-only "$BASE"..HEAD -- '*.ts' '*.vue' '*.mts' '*.js')
          pnpm exec oxfmt --write "${files[@]}"
          if ! git diff --quiet; then
            git diff --check
            git add "${files[@]}"
            HUSKY=0 git commit --amend --no-edit
          fi
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = 1

      - name: Type-aware Oxlint
        run: pnpm oxlint:main

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Browser test typecheck
        run: pnpm typecheck:browser

      - name: Workflow unit tests
        run: pnpm exec vitest run src/platform/workflow

      - name: Verify final topology and push mirror candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=ca54f4bd2eb03b9fc992feee3aff3b9700f73395
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = 1
          test "$(git status --porcelain)" = ''
          git diff --check "$BASE"..HEAD
          git diff --name-only "$BASE"..HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          echo '=== FINAL COMMIT ==='
          git log -1 --format=fuller
          echo '=== FINAL CHANGED FILE COUNT ==='
          git diff --name-only "$BASE"..HEAD | wc -l
          git push --force-with-lease origin HEAD:refs/heads/mirror/pr-14897-20260905-candidate
