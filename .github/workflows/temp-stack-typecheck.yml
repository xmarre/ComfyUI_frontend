name: temp stack typecheck

on:
  push:
    branches:
      - codex/10841-14897-typecheck-run
  pull_request:
    branches:
      - codex/10841-14897-typecheck-run

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
