name: PR 10841 guarded promotion

on:
  push:
    branches:
      - mirror/pr10841-reconcile-runner-20260910

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr10841-reconcile-current-20260910
          fetch-depth: 0

      - name: Verify and promote with force-with-lease
        shell: bash
        run: |
          set -euo pipefail
          candidate=bae97a7c3cf5d53533ccc0f5dd4fb0e0a21d4455
          base=61437e774d1bce44cff35b451adb49cfe7f0c93d
          old_head=a8d7c7c823efbe6126bcd404f7fc97fcfeb2d37b
          branch=codex/async-dnd-drop-bridge

          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-list --count "$base"..HEAD)" -eq 1

          git remote add upstream https://github.com/Comfy-Org/ComfyUI_frontend.git
          git fetch --no-tags upstream main
          test "$(git rev-parse upstream/main)" = "$base"

          remote_head=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_head" = "$old_head"

          expected=$(cat <<'EOF'
          src/composables/node/useNodeDragAndDrop.test.ts
          src/composables/node/useNodeDragAndDrop.ts
          src/composables/usePaste.test.ts
          src/composables/usePaste.ts
          src/renderer/extensions/vueNodes/components/LGraphNode.test.ts
          src/renderer/extensions/vueNodes/components/LGraphNode.vue
          src/renderer/extensions/vueNodes/composables/useVueNodeDragAndDrop.test.ts
          src/renderer/extensions/vueNodes/composables/useVueNodeDragAndDrop.ts
          src/renderer/extensions/vueNodes/widgets/composables/useImageUploadWidget.ts
          src/scripts/app.test.ts
          src/scripts/app.ts
          src/utils/__tests__/eventUtils.test.ts
          src/utils/eventUtils.ts
          src/utils/mediaUploadUtil.ts
          src/workbench/extensions/agent/AgentPanelRoot.test.ts
          src/workbench/extensions/agent/AgentPanelRoot.vue
          EOF
          )
          actual=$(git diff --name-only "$base"..HEAD | sort)
          diff -u <(printf '%s\n' "$expected" | sort) <(printf '%s\n' "$actual")
          test "$(printf '%s\n' "$actual" | sed '/^$/d' | wc -l)" -eq 16
          git diff --check "$base"..HEAD

          git push \
            --force-with-lease="refs/heads/$branch:$old_head" \
            origin "HEAD:refs/heads/$branch"

          promoted=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$promoted" = "$candidate"
