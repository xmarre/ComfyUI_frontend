name: PR 10841 mirror reconciliation runner

on:
  push:
    branches:
      - mirror/pr10841-reconcile-runner-20260910

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr10841-reconcile-candidate-20260910
          fetch-depth: 0

      - name: Configure and verify reconciliation base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Comfy-Org/ComfyUI_frontend.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin codex/async-dnd-drop-bridge

          expected_head=3cca1046af160aeb19634f0c57a274df5a436a33
          expected_upstream=7e678911d2725e16ebda7b70d460af5a3522f1e1
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git rev-parse upstream/main)" = "$expected_upstream"
          test "$(git rev-parse HEAD^)" = "$expected_upstream"

      - name: Apply clean overlap files
        shell: bash
        run: |
          set -euo pipefail
          old_base=ca54f4bd2eb03b9fc992feee3aff3b9700f73395
          old_head=a8d7c7c823efbe6126bcd404f7fc97fcfeb2d37b
