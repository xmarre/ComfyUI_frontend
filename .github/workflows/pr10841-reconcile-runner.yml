name: PR 10841 mirror reconciliation runner

on:
  push:
    branches:
      - mirror/pr10841-reconcile-runner-20260910

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr10841-reconcile-candidate-20260910
          fetch-depth: 0

      - name: Configure and verify base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Comfy-Org/ComfyUI_frontend.git
          git fetch --no-tags upstream main
          test "$(git rev-parse HEAD)" = 99bf0b0e5baaa70b6d7767d1a80fe8a3a4ace503
          test "$(git rev-parse upstream/main)" = 7e678911d2725e16ebda7b70d460af5a3522f1e1
          test "$(git rev-parse HEAD~3)" = 7e678911d2725e16ebda7b70d460af5a3522f1e1

      - name: Apply clean overlap files
        shell: bash
        run: |
          set -euo pipefail
          old_base=ca54f4bd2eb03b9fc992feee3aff3b9700f73395
          old_head=a8d7c7c823efbe6126bcd404f7fc97fcfeb2d37b
          git diff --binary "$old_base" "$old_head" -- \
            src/scripts/app.test.ts \
            src/scripts/app.ts \
            src/workbench/extensions/agent/AgentPanelRoot.test.ts \
            src/workbench/extensions/agent/AgentPanelRoot.vue \
            > /tmp/pr10841-clean-overlap.patch
          git apply --3way --index /tmp/pr10841-clean-overlap.patch
          python3 tools/pr10841_reconcile.py
          git add src/composables/usePaste.test.ts \
            src/renderer/extensions/vueNodes/components/LGraphNode.test.ts
          git diff --cached --check

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and scope check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files <<'EOF'
          src/composables/node/useNodeDragAndDrop.test.ts
          src/composables/node/useNodeDragAndDrop.ts
          src/composables/usePaste.test.ts
          src/composables/usePaste.ts
          src/renderer/extensions/vueNodes/components/LGraphNode.test.ts
          src/renderer/extensions/vueNodes/components/LGraphNode.vue
          src/renderer/extensions/vueNodes/composables/useVueNodeDragAndDrop.test.ts
          src/renderer/extensions/vueNodes/composables/useVueNodeDragAndDrop.ts
          src/renderer/extensions/vueNodes/widgets/composables/useImageUploadWidget.ts
          src/scripts/app.test.ts
          src/scripts/app.ts
          src/utils/__tests__/eventUtils.test.ts
          src/utils/eventUtils.ts
          src/utils/mediaUploadUtil.ts
          src/workbench/extensions/agent/AgentPanelRoot.test.ts
          src/workbench/extensions/agent/AgentPanelRoot.vue
          EOF
          pnpm exec oxfmt --write "${files[@]}"
          git add "${files[@]}"
          pnpm exec oxfmt --check "${files[@]}"
          git diff --cached --check

          actual=$(git diff --name-only upstream/main | grep '^src/' | sort)
          expected=$(printf '%s\n' "${files[@]}" | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          test "$(printf '%s\n' "$actual" | sed '/^$/d' | wc -l)" -eq 16

      - name: Changed-file ESLint
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only upstream/main | grep -E '^src/.*\.(ts|vue)$')
          pnpm exec eslint --no-cache "${files[@]}"

      - name: Vitest cleanup audit
        run: pnpm oxlint:audit

      - name: Typecheck
        run: pnpm typecheck

      - name: Knip
        run: pnpm knip

      - name: Targeted regression tests
        run: |
          pnpm exec vitest run \
            src/composables/node/useNodeDragAndDrop.test.ts \
            src/composables/usePaste.test.ts \
            src/renderer/extensions/vueNodes/components/LGraphNode.test.ts \
            src/renderer/extensions/vueNodes/composables/useVueNodeDragAndDrop.test.ts \
            src/scripts/app.test.ts \
            src/utils/__tests__/eventUtils.test.ts \
            src/workbench/extensions/agent/AgentPanelRoot.test.ts

      - name: Squash validated candidate and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm tools/pr10841_reconcile.py
          git add -A
          git diff --cached --check
          test "$(git diff --name-only upstream/main | grep '^src/' | wc -l)" -eq 16
          test -z "$(git diff --name-only upstream/main | grep -v '^src/' || true)"

          git reset --soft upstream/main
          git commit -m 'fix: restore Vue upload-node file drops'
          test "$(git rev-list --count upstream/main..HEAD)" -eq 1
          test "$(git rev-parse HEAD^)" = "$(git rev-parse upstream/main)"
          test "$(git diff --name-only upstream/main..HEAD | wc -l)" -eq 16
          git diff --check upstream/main..HEAD

          remote_sha=$(git ls-remote origin refs/heads/mirror/pr10841-reconcile-candidate-20260910 | cut -f1)
          git push \
            --force-with-lease=refs/heads/mirror/pr10841-reconcile-candidate-20260910:$remote_sha \
            origin HEAD:refs/heads/mirror/pr10841-reconcile-candidate-20260910
