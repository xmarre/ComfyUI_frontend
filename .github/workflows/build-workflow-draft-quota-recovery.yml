name: Build workflow draft quota recovery

on:
  push:
    branches:
      - codex/build-workflow-draft-quota-recovery
    paths:
      - .github/workflows/build-workflow-draft-quota-recovery.yml

permissions:
  contents: write

concurrency:
  group: build-workflow-draft-quota-recovery
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/build-workflow-draft-quota-recovery

      - name: Apply source fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-workflow-draft-quota-fix.py')
          text = path.read_text()
          old = """for label, old in [
              ('readIndex availability guard', '  if (!storageAvailable) return null\\n\\n'),
              ('readPayload availability guard', '  if (!storageAvailable) return null\\n\\n'),
              ('getPayloadKeys availability guard', '  if (!storageAvailable) return []\\n\\n'),
          ]:
              text = replace_once(text, old, '', label)
          """
          new = """null_guard = '  if (!storageAvailable) return null\\n\\n'
          if text.count(null_guard) != 2:
              raise RuntimeError(
                  f'read availability guards: expected two matches, found {text.count(null_guard)}'
              )
          text = text.replace(null_guard, '', 2)
          text = replace_once(
              text,
              '  if (!storageAvailable) return []\\n\\n',
              '',
              'getPayloadKeys availability guard',
          )
          """
          if old not in text:
              raise RuntimeError('patch-script availability block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python scripts/apply-workflow-draft-quota-fix.py

          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          path = Path(
              'src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.ts'
          )
          text = path.read_text()
          text = replace_once(
              text,
              "  const lastSavedJsonByPath = ref<Record<string, string>>({})\n",
              """  const lastSavedJsonByPath = ref<Record<string, string>>({})
          const failedSavePaths = new Set<string>()
          """,
              'failed save path state',
          )
          text = replace_once(
              text,
              """      draftStore.reset()
                lastSavedJsonByPath.value = {}
          """,
              """      draftStore.reset()
                lastSavedJsonByPath.value = {}
                failedSavePaths.clear()
          """,
              'persistence disabled cleanup',
          )
          text = replace_once(
              text,
              """    if (!saved) {
                toast.add({
                  severity: 'error',
                  summary: t('g.error'),
                  detail: t('toastMessages.failedToSaveDraft')
                })
                return
              }

              // Update session pointer
          """,
              """    if (!saved) {
                if (!failedSavePaths.has(workflowPath)) {
                  toast.add({
                    severity: 'error',
                    summary: t('g.error'),
                    detail: t('toastMessages.failedToSaveDraft')
                  })
                  failedSavePaths.add(workflowPath)
                }
                return
              }

              failedSavePaths.delete(workflowPath)

              // Update session pointer
          """,
              'save failure toast dedupe',
          )
          text = replace_once(
              text,
              """    draftStore.removeDraft(blank.path)
              delete lastSavedJsonByPath.value[blank.path]
              tabState.clearActivePathPointer()
          """,
              """    draftStore.removeDraft(blank.path)
              delete lastSavedJsonByPath.value[blank.path]
              failedSavePaths.delete(blank.path)
              tabState.clearActivePathPointer()
          """,
              'startup blank cleanup',
          )
          path.write_text(text)

          path = Path(
              'src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.test.ts'
          )
          text = path.read_text()
          marker = "  describe('loadPreviousWorkflowFromStorage', () => {\n"
          test_block = """  describe('save failure notifications', () => {
            it('shows one toast per continuous save failure episode', async () => {
              await loadBlankIntoActiveWorkflow()

              const draftStore = useWorkflowDraftStoreV2()
              const saveDraftSpy = vi.spyOn(draftStore, 'saveDraft')
              saveDraftSpy.mockReturnValue(false)

              mountWorkflowPersistence()

              mocks.state.currentGraph = { nodes: [{ id: 1 }] }
              mocks.state.graphChangedHandler?.()
              await vi.runAllTimersAsync()

              mocks.state.currentGraph = { nodes: [{ id: 2 }] }
              mocks.state.graphChangedHandler?.()
              await vi.runAllTimersAsync()

              expect(mockToastAdd).toHaveBeenCalledTimes(1)

              saveDraftSpy.mockReturnValueOnce(true)
              mocks.state.currentGraph = { nodes: [{ id: 3 }] }
              mocks.state.graphChangedHandler?.()
              await vi.runAllTimersAsync()

              expect(mockToastAdd).toHaveBeenCalledTimes(1)

              saveDraftSpy.mockReturnValueOnce(false)
              mocks.state.currentGraph = { nodes: [{ id: 4 }] }
              mocks.state.graphChangedHandler?.()
              await vi.runAllTimersAsync()

              expect(mockToastAdd).toHaveBeenCalledTimes(2)
            })
          })

          """
          text = replace_once(
              text,
              marker,
              test_block + marker,
              'save failure notification test insertion',
          )
          path.write_text(text)
          PY

      - name: Install frontend dependencies
        uses: ./.github/actions/setup-frontend

      - name: Format
        run: pnpm format

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:no-cache

      - name: Run persistence regression tests
        run: |
          pnpm test:unit \
            src/platform/workflow/persistence/base/storageIO.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.quotaSafety.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.fsm.test.ts \
            src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.test.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        env:
          NX_SKIP_NX_CACHE: 'true'
          VITE_USE_LEGACY_DEFAULT_GRAPH: 'true'
        run: pnpm run build

      - name: Publish clean source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git rm -f \
            .github/workflows/build-workflow-draft-quota-recovery.yml \
            scripts/apply-workflow-draft-quota-fix.py
          git add -A
          git diff --cached --check
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'fix: preserve workflow drafts across quota failures' | git commit-tree "$tree" -p 1485bb3ec538470143bd6fdb5c27bd4d246204f7)"
          git reset --hard "$commit"
          git push --force origin HEAD:fix/workflow-draft-quota-recovery
