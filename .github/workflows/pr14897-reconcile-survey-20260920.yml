name: PR14897 reconciliation 20260920

on:
  push:
    branches:
      - mirror/pr-14897-reconcile-runner-20260920
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      EXPECTED_BASE: 183f0ea8fdb473aa39572be60388bd767ca84913
      PR_HEAD: 6eab8c21ffba4d256de1b3548b422ef547652d8b
      CANDIDATE_BRANCH: mirror/pr-14897-reconcile-candidate-20260920
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconcile onto pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Comfy-Org/ComfyUI_frontend.git || true
          git fetch upstream main
          actual="$(git rev-parse upstream/main)"
          echo "upstream/main=$actual"
          test "$actual" = "$EXPECTED_BASE"

          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git checkout -B pr14897-candidate "$EXPECTED_BASE"

          set +e
          git cherry-pick "$PR_HEAD"
          rc=$?
          set -e
          test "$rc" -ne 0

          conflicts="$(git diff --name-only --diff-filter=U)"
          echo "conflicts=$conflicts"
          test "$conflicts" = "src/platform/workflow/management/stores/comfyWorkflow.ts"

          git checkout --ours -- src/platform/workflow/management/stores/comfyWorkflow.ts

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/platform/workflow/management/stores/comfyWorkflow.ts")
          s = path.read_text()

          anchor = "import { reportError } from '@/platform/telemetry/reportError'\n"
          addition = (
              anchor
              + "import { getValidWorkflowViewState } from '@/platform/workflow/persistence/base/workflowViewState'\n"
          )
          assert anchor in s
          s = s.replace(anchor, addition, 1)

          draft_pattern = re.compile(
              r"    if \(draft\) \{\n"
              r"      if \(draft\.updatedAt < this\.lastModified\) \{\n"
              r"        draftStore\.removeDraft\(this\.path\)\n"
              r"        draft = undefined\n"
              r"      \}\n"
              r"    \}\n"
          )
          draft_replacement = (
              "    // Temporary workflows restored from a draft have a synthetic creation\n"
              "    // timestamp, not an authoritative backing-file modification time. Comparing\n"
              "    // the draft against that timestamp makes every restored temporary draft look\n"
              "    // stale and deletes it immediately after recovery.\n"
              "    if (draft && !this.isTemporary) {\n"
              "      if (draft.updatedAt < this.lastModified) {\n"
              "        draftStore.removeDraft(this.path)\n"
              "        draft = undefined\n"
              "      }\n"
              "    }\n"
          )
          s, count = draft_pattern.subn(draft_replacement, s, count=1)
          assert count == 1, "upstream draft freshness block not found"

          state_pattern = re.compile(
              r"    const initialState = JSON\.parse\(this\.originalContent\)\n"
              r"    const \{ ChangeTracker \} = await import\('@/scripts/changeTracker'\)\n"
              r"    this\.changeTracker = markRaw\(new ChangeTracker\(this, initialState\)\)\n"
              r"    if \(draftState && draftContent\) \{\n"
              r"      this\.changeTracker\.activeState = draftState\n"
              r"      this\.content = draftContent\n"
              r"      this\._isModified = true\n"
          )
          state_replacement = (
              "    const initialState = JSON.parse(this.originalContent) as ComfyWorkflowJSON\n"
              "\n"
              "    // Older or malformed draft payloads may not carry a usable viewport. For a\n"
              "    // persisted workflow, retain the authoritative saved view when it is valid.\n"
              "    const savedViewState = getValidWorkflowViewState(initialState.extra?.ds)\n"
              "    const draftViewState = getValidWorkflowViewState(draftState?.extra?.ds)\n"
              "    if (draftState && !draftViewState && savedViewState) {\n"
              "      draftState = {\n"
              "        ...draftState,\n"
              "        extra: {\n"
              "          ...draftState.extra,\n"
              "          ds: savedViewState\n"
              "        }\n"
              "      }\n"
              "      draftContent = JSON.stringify(draftState)\n"
              "    }\n"
              "\n"
              "    const { ChangeTracker } = await import('@/scripts/changeTracker')\n"
              "    this.changeTracker = markRaw(new ChangeTracker(this, initialState))\n"
              "    if (draftState && draftContent) {\n"
              "      this.changeTracker.activeState = draftState\n"
              "      this.content = draftContent\n"
              "      // New drafts persist this bit when the outgoing canvas snapshot is taken.\n"
              "      // Older V2 drafts lack it, so stay conservative and preserve the historical\n"
              "      // behavior of treating any recovered draft as modified rather than doing a\n"
              "      // full synchronous graph comparison during workflow activation.\n"
              "      this._isModified = draft?.isModified ?? true\n"
          )
          s, count = state_pattern.subn(state_replacement, s, count=1)
          assert count == 1, "upstream draft overlay block not found"

          assert "error_loading_dialog_service_prompt_save" in s
          assert "return null" in s[s.index("async promptSave"):]
          path.write_text(s)

          path = Path("src/platform/workflow/persistence/stores/workflowDraftStoreV2.ts")
          s = path.read_text()
          s = s.replace("import { api } from '@/scripts/api'\n", "")
          s = s.replace("  workflowName: string | null\n", "")
          s = s.replace(
              """    const {
                workflowName,
                preferredPath,
                fallbackToLatestDraft = false
              } = options""",
              """    const { preferredPath, fallbackToLatestDraft = false } = options"""
          )
          pattern = re.compile(
              r"\n    // Legacy fallbacks are NOT workspace-scoped.*?\n  \}\n\n  /\*\*\n   \* Resets",
              re.S,
          )
          s, count = pattern.subn(
              "\n    return false\n  }\n\n  /**\n   * Resets",
              s,
              count=1,
          )
          assert count == 1, "legacy fallback block not found"
          assert "remove after 2026-07-15" not in s
          assert ("workflow:" + "$" + "{clientId}") not in s
          path.write_text(s)

          path = Path("src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.ts")
          s = path.read_text()
          s = re.sub(r"^\s*workflowName: null,\n", "", s, flags=re.M)
          path.write_text(s)

          path = Path("src/platform/workflow/persistence/migration/migrateV1toV2.ts")
          s = path.read_text()
          marker = "/**\n * Removes legacy workflow persistence keys for a workspace."
          idx = s.find(marker)
          assert idx >= 0, "retired migration helper marker not found"
          s = s[:idx].rstrip() + "\n"
          assert "export function cleanupV1Data" not in s
          assert "export function getMigrationStatus" not in s
          path.write_text(s)

          path = Path("src/platform/workflow/persistence/migration/migrateV1toV2.test.ts")
          s = path.read_text()
          s = s.replace("  cleanupV1Data,\n", "")
          s = s.replace("  getMigrationStatus,\n", "")
          cleanup_start = s.find("  describe('cleanupV1Data'")
          tab_start = s.find("  describe('V1 tab state migration'")
          assert cleanup_start >= 0 and tab_start > cleanup_start
          s = s[:cleanup_start] + s[tab_start:]
          status_start = s.find("  describe('getMigrationStatus'")
          assert status_start >= 0
          s = s[:status_start].rstrip() + "\n})\n"
          assert "cleanupV1Data" not in s
          assert "getMigrationStatus" not in s
          path.write_text(s)

          path = Path("src/platform/workflow/persistence/migration/migrateV1toV2.recovery.test.ts")
          s = path.read_text()
          s = s.replace("  cleanupV1Data,\n", "")
          s = s.replace("  getMigrationStatus,\n", "")
          s = re.sub(
              r"\n        expect\(getMigrationStatus\(personalWorkspace\)\)\.toEqual\(\{\n"
              r"          v1Exists: false,\n"
              r"          v2Exists: false,\n"
              r"          v1DraftCount: 0,\n"
              r"          v2DraftCount: 0\n"
              r"        \}\)",
              "",
              s,
              count=1,
          )
          start = s.find("  describe('cleanup and status'")
          assert start >= 0
          s = s[:start].rstrip() + "\n})\n"
          assert "cleanupV1Data" not in s
          assert "getMigrationStatus" not in s
          path.write_text(s)

          path = Path("src/platform/workflow/persistence/stores/workflowDraftStoreV2.test.ts")
          s = path.read_text()
          s = s.replace("import { app as comfyApp } from '@/scripts/app'\n", "")
          s = re.sub(r"^\s*workflowName: (?:null|'[^']*'),\n", "", s, flags=re.M)
          obsolete_fallback_tests = re.compile(
              r"\n    it\('does not use unscoped legacy fallbacks outside personal workspace'.*?"
              r"(?=\n    it\('returns false when no drafts available')",
              re.S,
          )
          s, count = obsolete_fallback_tests.subn("", s, count=1)
          assert count == 1, "obsolete runtime fallback tests not found"
          assert "keeps the legacy fallback available in personal workspace" not in s
          path.write_text(s)
          # Bring PR-added tests forward to the repository's current conventions.
          def modernize_test_harness(test_path: str) -> None:
              p = Path(test_path)
              text = p.read_text()
              text = re.sub(
                  r"^import \{ createTestingPinia \} from '@pinia/testing'\n",
                  "",
                  text,
                  flags=re.M,
              )
              text = re.sub(
                  r"^import \{ createPinia, setActivePinia \} from 'pinia'\n",
                  "",
                  text,
                  flags=re.M,
              )
              text = re.sub(
                  r"^import \{ setActivePinia \} from 'pinia'\n",
                  "",
                  text,
                  flags=re.M,
              )
              text = re.sub(
                  r"^\s*setActivePinia\(createTestingPinia\(\{ stubActions: false \}\)\)\n",
                  "",
                  text,
                  flags=re.M,
              )
              text = re.sub(
                  r"^\s*setActivePinia\(createTestingPinia\(\)\)\n",
                  "",
                  text,
                  flags=re.M,
              )
              text = re.sub(
                  r"^\s*setActivePinia\(createPinia\(\)\)\n",
                  "",
                  text,
                  flags=re.M,
              )
              text = re.sub(
                  r"vi\.mock\(\s*(['\"])([^'\"]+)\1\s*,",
                  lambda m: f"vi.mock(import({m.group(1)}{m.group(2)}{m.group(1)}),",
                  text,
              )
              p.write_text(text)

          for test_path in [
              "src/platform/workflow/persistence/stores/workflowDraftStoreV2.persistenceControl.test.ts",
              "src/platform/workflow/management/stores/workflowStore.persistence.test.ts",
              "src/platform/workflow/persistence/stores/workflowDraftStoreV2.test.ts",
          ]:
              modernize_test_harness(test_path)

          # The fault-injection suites used resetModules plus a private Pinia.
          # Use the global testing Pinia and reset storage availability explicitly.
          for test_path in [
              "src/platform/workflow/persistence/stores/workflowDraftStoreV2.quotaSafety.test.ts",
              "src/platform/workflow/persistence/stores/workflowDraftStoreV2.rollbackSafety.test.ts",
          ]:
              modernize_test_harness(test_path)
              p = Path(test_path)
              text = p.read_text()
              storage_import = "import { StorageKeys } from '../base/storageKeys'\n"
              assert storage_import in text
              text = text.replace(
                  storage_import,
                  "import { resetStorageAvailable } from '../base/storageIO'\n"
                  + storage_import
                  + "import { useWorkflowDraftStoreV2 } from './workflowDraftStoreV2'\n",
                  1,
              )
              text, count = re.subn(
                  r"\nasync function freshStore\(\) \{\n"
                  r"  vi\.resetModules\(\)\n"
                  r"  const \{ useWorkflowDraftStoreV2 \} = await import\('./workflowDraftStoreV2'\)\n"
                  r"  return useWorkflowDraftStoreV2\(\)\n"
                  r"\}\n",
                  "\n",
                  text,
                  count=1,
              )
              assert count == 1, f"freshStore helper not found in {test_path}"
              text = text.replace(
                  "const store = await freshStore()",
                  "const store = useWorkflowDraftStoreV2()",
              )
              text = text.replace(
                  "    sessionStorage.clear()\n",
                  "    sessionStorage.clear()\n    resetStorageAvailable()\n",
                  1,
              )
              assert "freshStore" not in text
              p.write_text(text)

          # Fold workflowService persistence coverage into the canonical suite.
          p = Path("src/platform/workflow/core/services/workflowService.test.ts")
          text = p.read_text()
          start = text.index(
              "    it('should save active workflow state through the V2 draft store'"
          )
          end = text.index(
              "    it('should show an error toast when the V2 draft store cannot save'",
              start,
          )
          block = text[start:end]
          close = block.rfind("    })")
          assert close >= 0
          block = (
              block[:close]
              + "      expect(useWorkflowDraftStoreV2().markSaveSucceeded).toHaveBeenCalledOnce()\n"
              + block[close:]
          )
          block += """    it('does not persist the outgoing workflow while persistence is paused', () => {
      vi.spyOn(useSettingStore(), 'get').mockImplementation((key: string) => {
        return key === 'Comfy.Workflow.Persist'
      })
      const activeWorkflow = createModeTestWorkflow({
        path: 'workflows/paused.json'
      })
      workflowStore.activeWorkflow = activeWorkflow
      vi.mocked(useWorkflowDraftStoreV2().isPersistencePaused).mockReturnValue(
        true
      )

      useWorkflowService().beforeLoadNewGraph()

      expect(useWorkflowDraftStoreV2().saveDraft).not.toHaveBeenCalled()
    })

    it('persists workflow view state when view restore is enabled', () => {
      vi.spyOn(useSettingStore(), 'get').mockImplementation((key: string) => {
        return (
          key === 'Comfy.Workflow.Persist' ||
          key === 'Comfy.EnableWorkflowViewRestore'
        )
      })
      const activeWorkflow = createModeTestWorkflow({
        path: 'workflows/view-state.json'
      })
      activeWorkflow.changeTracker.ds = { scale: 0.5, offset: [10, -20] }
      workflowStore.activeWorkflow = activeWorkflow

      useWorkflowService().beforeLoadNewGraph()

      const [, payload] = vi.mocked(useWorkflowDraftStoreV2().saveDraft).mock
        .calls[0]
      expect(JSON.parse(payload).extra.ds).toEqual({
        scale: 0.5,
        offset: [10, -20]
      })
    })

"""
          text = text[:start] + block + text[end:]

          throw_anchor = (
              "    it('should log and show an error toast when the V2 draft store throws'"
          )
          idx = text.index(throw_anchor)
          dedupe = """    it('deduplicates repeated failures through the shared failure episode', () => {
      vi.spyOn(useSettingStore(), 'get').mockImplementation((key: string) => {
        return key === 'Comfy.Workflow.Persist'
      })
      const addToastSpy = vi.spyOn(useToastStore(), 'add')
      vi.mocked(useWorkflowDraftStoreV2().saveDraft).mockReturnValue(false)
      vi.mocked(useWorkflowDraftStoreV2().shouldNotifySaveFailure)
        .mockReturnValueOnce(true)
        .mockReturnValueOnce(false)
      workflowStore.activeWorkflow = createModeTestWorkflow({
        path: 'workflows/failure-episode.json'
      })

      const service = useWorkflowService()
      service.beforeLoadNewGraph()
      service.beforeLoadNewGraph()

      expect(
        useWorkflowDraftStoreV2().shouldNotifySaveFailure
      ).toHaveBeenCalledTimes(2)
      expect(addToastSpy).toHaveBeenCalledTimes(1)
    })

"""
          text = text[:idx] + dedupe + text[idx:]
          p.write_text(text)
          Path(
              "src/platform/workflow/core/services/workflowService.persistence.test.ts"
          ).unlink()

          # Fold reconciliation coverage into the canonical persistence suite.
          p = Path(
              "src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.test.ts"
          )
          text = p.read_text()

          anchor = "  describe('loadPreviousWorkflowFromStorage', () => {"
          idx = text.index(anchor)
          failure_episode = """  it('keeps one save-failure notification across workflow transitions until recovery', async () => {
    await loadBlankIntoActiveWorkflow()

    const workflowStore = useWorkflowStore()
    const draftStore = useWorkflowDraftStoreV2()
    const saveDraftSpy = vi.spyOn(draftStore, 'saveDraft')
    saveDraftSpy.mockReturnValue(false)

    mountWorkflowPersistence()

    mocks.state.currentGraph = { nodes: [{ id: 1 }] }
    mocks.state.graphChangedHandler?.()
    await vi.runAllTimersAsync()

    mocks.state.currentGraph = { nodes: [{ id: 2 }] }
    mocks.state.graphChangedHandler?.()
    await vi.runAllTimersAsync()
    expect(mockToastAdd).toHaveBeenCalledTimes(1)

    const second = workflowStore.createTemporary('second-workflow.json')
    await workflowStore.openWorkflow(second)
    await nextTick()
    expect(mockToastAdd).toHaveBeenCalledTimes(1)

    saveDraftSpy.mockReturnValueOnce(true)
    mocks.state.currentGraph = { nodes: [{ id: 3 }] }
    mocks.state.graphChangedHandler?.()
    await vi.runAllTimersAsync()

    saveDraftSpy.mockReturnValueOnce(false)
    mocks.state.currentGraph = { nodes: [{ id: 4 }] }
    mocks.state.graphChangedHandler?.()
    await vi.runAllTimersAsync()
    expect(mockToastAdd).toHaveBeenCalledTimes(2)
  })

"""
          text = text[:idx] + failure_episode + text[idx:]

          startup_anchor = (
              "    it('persists a temporary workflow once the user has modified it', async () => {"
          )
          idx = text.index(startup_anchor)
          startup_test = """    it('persists a modified temporary startup workflow synchronously only once', async () => {
      loadBlankWorkflowMock.mockImplementation(async () => {
        await loadBlankIntoActiveWorkflow()
        const workflow = useWorkflowStore().activeWorkflow
        if (workflow) workflow.isModified = true
      })

      const draftStore = useWorkflowDraftStoreV2()
      const saveDraftSpy = vi.spyOn(draftStore, 'saveDraft')
      vi.spyOn(draftStore, 'getDraft').mockReturnValue(null)

      const { initializeWorkflow } = mountWorkflowPersistence()

      await initializeWorkflow()
      expect(saveDraftSpy).toHaveBeenCalledOnce()

      await vi.runAllTimersAsync()
      expect(saveDraftSpy).toHaveBeenCalledOnce()
    })

"""
          text = text[:idx] + startup_test + text[idx:]

          restore_anchor = "    it('skips activation when persistence is disabled', async () => {"
          idx = text.index(restore_anchor)
          invalid_test = """    it('uses a default temporary workflow for schema-invalid draft JSON', async () => {
      const workflowStore = useWorkflowStore()
      vi.spyOn(workflowStore, 'loadWorkflows').mockResolvedValue()
      vi.spyOn(console, 'warn').mockImplementation(() => {})

      const draftStore = useWorkflowDraftStoreV2()
      const path = 'workflows/invalid-draft.json'
      expect(
        draftStore.saveDraft(path, JSON.stringify({ title: 'not-a-workflow' }), {
          name: 'invalid-draft.json',
          isTemporary: true
        })
      ).toBe(true)
      writeTabState([path], 0)

      const { restoreWorkflowTabsState } = mountWorkflowPersistence()
      await restoreWorkflowTabsState()

      const restored = workflowStore.getWorkflowByPath(path)
      expect(restored).toBeDefined()
      if (!restored?.content) {
        throw new Error('Expected restored temporary workflow content')
      }
      const restoredData = JSON.parse(restored.content) as {
        version?: unknown
        title?: unknown
      }
      expect(typeof restoredData.version).toBe('number')
      expect(restoredData.title).toBeUndefined()
      expect(draftStore.getDraft(path)).toBeNull()
    })

"""
          text = text[:idx] + invalid_test + text[idx:]
          p.write_text(text)
          Path(
              "src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.reconciliation.test.ts"
          ).unlink()

          # Apply dynamic mock syntax after folding tests.
          for test_path in [
              "src/platform/workflow/core/services/workflowService.test.ts",
              "src/platform/workflow/management/stores/workflowStore.persistence.test.ts",
              "src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.test.ts",
              "src/platform/workflow/persistence/stores/workflowDraftStoreV2.persistenceControl.test.ts",
              "src/platform/workflow/persistence/stores/workflowDraftStoreV2.quotaSafety.test.ts",
              "src/platform/workflow/persistence/stores/workflowDraftStoreV2.rollbackSafety.test.ts",
              "src/platform/workflow/persistence/stores/workflowDraftStoreV2.test.ts",
          ]:
              modernize_test_harness(test_path)

          PY

          git add src/platform/workflow/management/stores/comfyWorkflow.ts
          git add src/platform/workflow/persistence
          GIT_EDITOR=true git cherry-pick --continue

          git add src/platform/workflow/management/stores/comfyWorkflow.ts src/platform/workflow/persistence
          git commit --amend --no-edit

          test "$(git rev-list --count "$EXPECTED_BASE"..HEAD)" -eq 1
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          ! git grep -n "remove after 2026-07-15" HEAD -- src/platform/workflow/persistence
          ! git grep -n "cleanupV1Data\|getMigrationStatus" HEAD -- src/platform/workflow/persistence
          ! git grep -n "workflowName:" HEAD -- src/platform/workflow/persistence
          git grep -n "error_loading_dialog_service_prompt_save" HEAD -- src/platform/workflow/management/stores/comfyWorkflow.ts
          git status --short

      - uses: actions/setup-node@v5
        with:
          node-version: 26.8.2
          package-manager-cache: false

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize changed TypeScript files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE"...HEAD -- '*.ts' '*.tsx')
          printf '%s\n' "${changed[@]}"
          if (("${#changed[@]}" > 0)); then
            pnpm exec oxfmt --write "${changed[@]}"
          fi
          if ! git diff --quiet; then
            git add "${changed[@]}"
            HUSKY=0 git commit --amend --no-edit
          fi
          test "$(git rev-list --count "$EXPECTED_BASE"..HEAD)" -eq 1
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm exec vitest run \
            src/platform/workflow/management/stores/comfyWorkflow.test.ts \
            src/platform/workflow/core/services/workflowService.test.ts \
            src/platform/workflow/core/services/workflowService.persistence.test.ts \
            src/platform/workflow/management/stores/workflowStore.persistence.test.ts \
            src/platform/workflow/persistence/base/storageIO.test.ts \
            src/platform/workflow/persistence/base/workflowViewState.test.ts \
            src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.test.ts \
            src/platform/workflow/persistence/migration/migrateV1toV2.collision.test.ts \
            src/platform/workflow/persistence/migration/migrateV1toV2.malformedPayload.test.ts \
            src/platform/workflow/persistence/migration/migrateV1toV2.recovery.test.ts \
            src/platform/workflow/persistence/migration/migrateV1toV2.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.persistenceControl.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.quotaSafety.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.rollbackSafety.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.test.ts

          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE"...HEAD -- '*.ts' '*.tsx')
          pnpm exec oxfmt --check "${changed[@]}"
          pnpm exec eslint "${changed[@]}"
          pnpm exec oxlint --type-aware "${changed[@]}"
          git diff --check "$EXPECTED_BASE"...HEAD

          test "$(git rev-list --count "$EXPECTED_BASE"..HEAD)" -eq 1
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          echo "FINAL_SHA=$(git rev-parse HEAD)"
          echo "CHANGED_FILES=$(git diff --name-only "$EXPECTED_BASE"...HEAD | wc -l)"
          echo "CHANGED_TS_FILES=${#changed[@]}"

      - name: Recheck upstream and publish validated mirror
        shell: bash
        run: |
          set -euo pipefail
          git fetch upstream main
          actual="$(git rev-parse upstream/main)"
          echo "upstream/main-after-validation=$actual"
          test "$actual" = "$EXPECTED_BASE"
          git push origin HEAD:"refs/heads/$CANDIDATE_BRANCH" --force
