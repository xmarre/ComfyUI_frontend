name: PR 10841 mirror reconcile probe

on:
  push:
    branches:
      - mirror/pr-10841-20260905-work

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce current upstream conflicts
        shell: bash
        run: |
          set -u
          git config user.name "PR 10841 mirror probe"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git remote add upstream https://github.com/Comfy-Org/ComfyUI_frontend.git || true
          git fetch upstream main
          git fetch origin codex/async-dnd-drop-bridge
          git reset --hard ca54f4bd2eb03b9fc992feee3aff3b9700f73395
          set +e
          git cherry-pick 96bd8910108c99e9e5b394ea158eaf5f4f3059b8
          rc=$?
          set -e
          echo "CHERRY_PICK_RC=$rc"
          echo "--- status ---"
          git status --short
          echo "--- unmerged files ---"
          git diff --name-only --diff-filter=U
          echo "--- conflict diff ---"
          git diff --merge || true
          exit 1
