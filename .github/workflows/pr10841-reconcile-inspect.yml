name: PR 10841 reconciliation inspection

on:
  push:
    branches:
      - automation/pr10841-reconcile-20260917

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct merge and print conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            refs/heads/checkpoint/pr10841-20260917-bae97a7:refs/remotes/origin/pr10841-checkpoint \
            refs/heads/automation/pr10841-reconcile-20260917:refs/remotes/origin/reconcile-automation
          git checkout --detach 14ba4d588081bbe799432523008944b13d19d1d9
          set +e
          git merge --no-commit --no-ff bae97a7c3cf5d53533ccc0f5dd4fb0e0a21d4455
          merge_rc=$?
          set -e
          echo "merge_rc=$merge_rc"
          echo "--- status ---"
          git status --short
          echo "--- unresolved paths ---"
          git diff --name-only --diff-filter=U
          for file in $(git diff --name-only --diff-filter=U); do
            echo "===== CONFLICT: $file ====="
            git checkout --conflict=merge -- "$file"
            awk '
              /^<<<<<<< / { start=NR-20; if (start < 1) start=1; in_conflict=1 }
              { lines[NR]=$0 }
              /^>>>>>>> / && in_conflict {
                end=NR+20
                for (i=start; i<=end; i++) pending[i]=1
                in_conflict=0
              }
              END {
                last=0
                for (i=1; i<=NR; i++) {
                  if (pending[i]) {
                    if (last && i > last+1) print "..."
                    printf "%6d  %s\n", i, lines[i]
                    last=i
                  }
                }
              }
            ' "$file"
          done
          test "$merge_rc" -ne 0
