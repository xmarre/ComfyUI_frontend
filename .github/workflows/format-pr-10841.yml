name: Format PR 10841

on:
  push:
    branches:
      - codex/validate-pr-10841
    paths:
      - .github/workflows/format-pr-10841.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/validate-pr-10841

      - uses: ./.github/actions/setup-frontend

      - run: pnpm format

      - name: Commit formatted source
        run: |
          set -euo pipefail
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git add src/scripts/app.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format app drop tests"
          git push origin HEAD:codex/validate-pr-10841
